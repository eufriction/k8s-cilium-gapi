# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumenvoyextprocfilter_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumEnvoyExtProcFilter
metadata:
  name: shared-backend-ext-proc
  namespace: ext-proc-shared-backend
  labels:
    app.kubernetes.io/part-of: demo
spec:
  backendRef:
    name: shared
    port: 8080
  processingMode:
    requestHeaderMode: SEND
    responseHeaderMode: SKIP
    requestBodyMode: NONE
    responseBodyMode: NONE
