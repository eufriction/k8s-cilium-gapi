apiVersion: cilium.io/v2alpha1
kind: CiliumEnvoyExtProcFilter
metadata:
  name: route-mutator
  namespace: backend-a
spec:
  backendRef:
    name: route-mutator-extproc
    namespace: gateway-system
    port: 4317
  processingMode:
    requestHeaderMode: SEND
    responseHeaderMode: SKIP
    requestBodyMode: NONE
    responseBodyMode: NONE
