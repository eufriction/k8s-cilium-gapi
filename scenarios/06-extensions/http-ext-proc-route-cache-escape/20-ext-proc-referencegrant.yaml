apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-backend-a-ext-proc-filter-to-route-mutator
  namespace: gateway-system
spec:
  from:
    - group: cilium.io
      kind: CiliumEnvoyExtProcFilter
      namespace: backend-a
  to:
    - group: ""
      kind: Service
      name: route-mutator-extproc
