apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: newest-route
  namespace: backend-b
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - name: ext-proc-conflict-resolution-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - ext-proc-newest.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: newest-first
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: newest-last
      backendRefs:
        - name: api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-route
  namespace: backend-a
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - name: ext-proc-conflict-resolution-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - ext-proc-auth.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: auth-extproc
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: external-authz
              namespace: auth
              port: 8080
            http:
              path: /check
              allowedHeaders:
                - X-Authz-Token
              allowedResponseHeaders:
                - X-Ext-Authz-Result
      backendRefs:
        - name: api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: invalid-route
  namespace: backend-a
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - name: ext-proc-conflict-resolution-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - ext-proc-invalid.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: does-not-exist
      backendRefs:
        - name: api
          port: 80
