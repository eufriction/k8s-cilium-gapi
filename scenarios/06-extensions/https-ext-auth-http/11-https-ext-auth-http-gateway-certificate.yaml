apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: https-ext-auth-http-gateway-certificate
  namespace: gateway-system
spec:
  secretName: https-ext-auth-http-gateway-tls
  commonName: ext-auth-http.example.test
  dnsNames:
    - "*.example.test"
    - ext-auth-http.example.test
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    kind: Issuer
    name: https-ext-auth-http-selfsigned
