# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ext-auth-http-route
  namespace: backend-a
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - name: ext-auth-http-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - ext-auth-http.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /public
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /http-auth
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: external-authz
              namespace: auth
              port: 8080
            http:
              path: /check
              allowedHeaders:
                - X-Authz-Token
              allowedResponseHeaders:
                - X-Ext-Authz-Result
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /http-auth-shared
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: external-authz
              namespace: auth
              port: 8080
            http:
              path: /check
              allowedHeaders:
                - X-Authz-Token
              allowedResponseHeaders:
                - X-Ext-Authz-Result
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /http-auth-variant
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: external-authz
              namespace: auth
              port: 8080
            http:
              path: /variant-check
              allowedHeaders:
                - X-Debug-Token
              allowedResponseHeaders:
                - X-Ext-Authz-Result
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: 80
