# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: 00-b-before-c
  namespace: ext-proc-ordering
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ordering-gateway
      namespace: ext-proc-ordering
      sectionName: direct
      port: 8080
  hostnames:
    - direct.ordering.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /foundation
      filters:
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: order-b
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: order-c
      backendRefs:
        - name: backend
          port: 80
