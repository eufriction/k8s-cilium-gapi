apiVersion: v1
kind: Namespace
metadata:
  name: ext-proc-ordering
  labels:
    app.kubernetes.io/part-of: demo
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ext-proc-ordering
  labels:
    app.kubernetes.io/part-of: demo
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ext-proc-backend
  namespace: ext-proc-ordering
  labels:
    app.kubernetes.io/part-of: demo
spec:
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
      appProtocol: kubernetes.io/h2c
