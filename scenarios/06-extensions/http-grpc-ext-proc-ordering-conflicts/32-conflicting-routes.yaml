# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-reverse-conflict
  namespace: ext-proc-ordering
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ordering-gateway
      namespace: ext-proc-ordering
      sectionName: direct
      port: 8080
  hostnames:
    - direct.ordering.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /http-conflict
      filters:
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: order-b
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: order-a
      backendRefs:
        - name: backend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-cycle-conflict
  namespace: ext-proc-ordering
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ordering-gateway
      namespace: ext-proc-ordering
      sectionName: direct
      port: 8080
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: ordering-listeners
      namespace: ext-proc-ordering
      sectionName: delegated
      port: 8080
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ordering-other-gateway
      namespace: ext-proc-ordering
      sectionName: isolated
      port: 8081
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ordering-gateway
      namespace: ext-proc-ordering
      sectionName: missing
      port: 8080
  hostnames:
    - direct.ordering.example.test
    - delegated.ordering.example.test
    - isolated.ordering.example.test
  rules:
    - matches:
        - method:
            service: ordering.v1.Test
            method: Check
        - method:
            service: ordering.v1.Test
            method: Stream
      filters:
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: order-c
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: losing-only-d
        - type: ExtensionRef
          extensionRef:
            group: cilium.io
            kind: CiliumEnvoyExtProcFilter
            name: order-a
      backendRefs:
        - name: backend
          port: 80
