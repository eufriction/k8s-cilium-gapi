# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ext-auth-missing-backend-route
  namespace: backend-a
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - name: ext-auth-missing-backend-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - ext-auth-missing-backend.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: external-authz-missing
              namespace: auth
              port: 8080
            http:
              path: /check
      backendRefs:
        - name: api
          port: 80
