---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grpc-ext-proc-gateway
  namespace: gateway-system
  labels:
    app.kubernetes.io/part-of: demo
spec:
  gatewayClassName: cilium
  listeners:
    - name: grpcs
      protocol: HTTPS
      port: 443
      hostname: grpc-ext-proc.example.test
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: grpc-ext-proc-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
