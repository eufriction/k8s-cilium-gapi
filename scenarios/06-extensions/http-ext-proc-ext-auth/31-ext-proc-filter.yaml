apiVersion: cilium.io/v2alpha1
kind: CiliumEnvoyExtProcFilter
metadata:
  name: coraza-waf
  namespace: backend-a
spec:
  backendRef:
    name: coraza-waf-extproc
    namespace: gateway-system
    port: 4317
  processingMode:
    requestHeaderMode: SEND
    responseHeaderMode: SKIP
    requestBodyMode: NONE
    responseBodyMode: NONE
