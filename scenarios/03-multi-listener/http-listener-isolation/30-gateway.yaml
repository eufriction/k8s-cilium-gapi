---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-listener-isolation-gateway
  namespace: gateway-system
  labels:
    app.kubernetes.io/part-of: demo
spec:
  gatewayClassName: cilium
  listeners:
    # Least specific: matches any hostname not claimed by a more specific listener
    - name: catch-all
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Wildcard: *.example.test
    - name: wildcard-example
      protocol: HTTP
      port: 80
      hostname: "*.example.test"
      allowedRoutes:
        namespaces:
          from: All
    # More specific wildcard: *.foo.example.test
    - name: wildcard-foo
      protocol: HTTP
      port: 80
      hostname: "*.foo.example.test"
      allowedRoutes:
        namespaces:
          from: All
    # Most specific: exact hostname abc.foo.example.test
    - name: exact-abc-foo
      protocol: HTTP
      port: 80
      hostname: "abc.foo.example.test"
      allowedRoutes:
        namespaces:
          from: All
