---
# All three TLSRoutes passthrough to the same backend-mtls pod. Only the
# listener and port differ, which is what this scenario exercises.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/tlsroute_v1alpha2.json
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: backend-b-mtls-50051-route
  namespace: backend-b
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - name: https-tls-shared-port-multi-tls-ports-gateway
      namespace: gateway-system
      sectionName: tls-50051
  hostnames:
    - mtls-50051.example.test
  rules:
    - backendRefs:
        - name: backend-mtls
          port: 9443
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/tlsroute_v1alpha2.json
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: backend-b-mtls-9443-route
  namespace: backend-b
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - name: https-tls-shared-port-multi-tls-ports-gateway
      namespace: gateway-system
      sectionName: tls-9443
  hostnames:
    - mtls-9443.example.test
  rules:
    - backendRefs:
        - name: backend-mtls
          port: 9443
---
# This route shares port 443 with the HTTPS-terminated listener.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/tlsroute_v1alpha2.json
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: backend-b-mtls-443-route
  namespace: backend-b
  labels:
    app.kubernetes.io/part-of: demo
spec:
  parentRefs:
    - name: https-tls-shared-port-multi-tls-ports-gateway
      namespace: gateway-system
      sectionName: tls-443
  hostnames:
    - mtls-443.example.test
  rules:
    - backendRefs:
        - name: backend-mtls
          port: 9443
