---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https-tls-shared-port-multi-tls-ports-gateway
  namespace: gateway-system
  labels:
    app.kubernetes.io/part-of: demo
spec:
  gatewayClassName: cilium
  listeners:
    # These two split-port listeners select the per-port TLS translation path.
    - name: tls-50051
      protocol: TLS
      port: 50051
      hostname: "mtls-50051.example.test"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
    - name: tls-9443
      protocol: TLS
      port: 9443
      hostname: "mtls-9443.example.test"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
    # These disjoint listeners intentionally share port 443.
    - name: https-443
      protocol: HTTPS
      port: 443
      hostname: "web.example.test"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: https-tls-shared-port-multi-tls-ports-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: tls-443
      protocol: TLS
      port: 443
      hostname: "mtls-443.example.test"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
