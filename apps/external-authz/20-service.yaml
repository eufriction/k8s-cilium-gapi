apiVersion: v1
kind: Service
metadata:
  name: external-authz
  labels:
    app: external-authz
    app.kubernetes.io/name: external-authz
    app.kubernetes.io/part-of: demo
spec:
  selector:
    app: external-authz
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9000
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
  type: ClusterIP
