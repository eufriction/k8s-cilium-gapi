monorepo_root = true

[monorepo]
config_roots = ["scenarios/*", "scenarios/*/*"]

[settings]
experimental = true

[env]
NETSHOOT_VERSION = "v0.15"
HTTPBIN_VERSION = "2.22.1"
ENVOY_VERSION = "1.33.2"
BACKEND_GRPC_VERSION = "0.1.1"
CORAZA_WAF_EXTPROC_VERSION = "0.1.0"
EXTERNAL_AUTHZ_VERSION = "0.1.0"
CILIUM_VERSION = "1.19.3"
CILIUM_CHART_DIR = ""
CILIUM_AGENT_IMAGE = ""
CILIUM_OPERATOR_IMAGE = ""
CLOUD_PROVIDER_KIND_VERSION = "0.11.1"
CERT_MANAGER_VERSION = "1.20.2"
GATEWAY_API_VERSION = "1.4.1"
KYVERNO_CHART_VERSION = "3.7.1"
KIND_CLUSTER_NAME = "k8s-cilium-gapi"
# Version-conditional vars (X_ prefix). Defaults match 1.19.3 (latest stable).
# Override by copying a versions/*.toml to mise.local.toml.
X_GRPCROUTE_ACCEPTED_MSG = "Accepted HTTPRoute"
X_TLSROUTE_ACCEPTED_MSG = "Accepted HTTPRoute"
X_TLSROUTE_API_VERSION = "v1alpha2"
SCENARIO_SKIP_VERSIONS = ""
POD_READY_TIMEOUT = "10"
MTLS_POD_READY_TIMEOUT = "60"
GW_READY_TIMEOUT = "5"
ROUTE_READY_TIMEOUT = "5"
PRE_DELETE_SLEEP = "5"
POST_DELETE_SLEEP = "0"
LISTENER_READY_TIMEOUT = "5"
ENVOY_READY_TIMEOUT = "30"
ENVOY_TEARDOWN_TIMEOUT = "30"

[tools]
"aqua:betterleaks/betterleaks" = "latest"
hk = "latest"
pkl = "latest"
k9s = "latest"
kind = "latest"
kubectl = "latest"
grpcurl = "latest"
go = "latest"
helm = "latest"
cilium-cli = "latest"
cilium-hubble = "latest"
kyverno = "latest"
node = "latest"
prettier = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
vale = "latest"

[hooks]
enter = """
hk install
if ! helm plugin list | grep -q '^images'; then
  echo ""
  echo "helm-images plugin is required but not installed."
  echo ""
  echo "It is used to discover container images from Helm charts so they"
  echo "can be pre-loaded into the kind cluster. Without it, the"
  echo "kind:load:cilium and kind:load:kyverno tasks will fail, which"
  echo "means cluster:start and all scenarios will not work."
  echo ""
  if [[ -t 0 ]]; then
    read -rp "Install it now? [Y/n] " answer
  else
    answer="n"
    echo "Non-interactive shell; skipping automatic helm-images installation." >&2
  fi
  if [[ "${answer}" =~ ^[Nn] ]]; then
    echo "Skipping. Run 'helm plugin install https://github.com/nikhilsbhat/helm-images' manually when ready." >&2
  else
    helm plugin install https://github.com/nikhilsbhat/helm-images
  fi
fi
"""

[task_templates."scenario:start"]
usage = '''
flag "-v --verbose" env="VERBOSE" help="Enable verbose output for image pulls and builds"
flag "-d --delete" env="DELETE" help="Delete scenario resources after verify"
'''
run = """
if [ -n "${SCENARIO_SKIP_VERSIONS:-}" ]; then
  for _v in ${SCENARIO_SKIP_VERSIONS}; do
    if [ "$_v" = "${CILIUM_VERSION}" ]; then
      echo "SKIP: known broken on Cilium ${CILIUM_VERSION}"
      exit 0
    fi
  done
fi
kubectl rollout status daemonset/cilium -n kube-system --timeout=60s >/dev/null
if [ "${FIXTURE_DEPLOYED:-}" = "true" ] && [ -d gateway ]; then
  kubectl kustomize gateway/ --load-restrictor=LoadRestrictionsNone | kubectl apply -f -
else
  kubectl apply -k .
fi
mise run :verify{% if usage.delete %} --delete{% endif %}
"""

[task_templates."scenario:verify"]
usage = 'flag "-d --delete"'
depends_post = [":delete{% if usage.delete %} --delete{% endif %}"]
run = "./verify.sh \"{{config_root}}\""

[task_templates."scenario:delete"]
usage = 'flag "-d --delete"'
run = 'if [ "${usage_delete:-false}" = "true" ]; then "{{config_root}}/../../../lib/scenario-delete.sh"; else echo "--- SKIPPED Deleting scenario resources ---"; fi'

[tasks."fixture:start"]
description = "Pre-deploy shared backend pods for faster scenario runs"
usage = 'flag "-v --verbose" env="VERBOSE"'
depends = [
  "kind:load:apps{% if usage.verbose %} --verbose{% endif %}",
  "cert-manager:install",
]
run = """
set -euo pipefail
kubectl apply -k config/fixture
echo "Waiting for fixture pods and certificates..."
# Certificates must be ready before mTLS pods can start
kubectl wait certificate/backend-a-mtls-ca -n backend-a --for=condition=Ready --timeout=60s
kubectl wait certificate/backend-a-mtls-server -n backend-a --for=condition=Ready --timeout=60s
kubectl wait certificate/backend-a-mtls-client -n backend-a --for=condition=Ready --timeout=60s
kubectl wait certificate/backend-b-mtls-ca -n backend-b --for=condition=Ready --timeout=60s
kubectl wait certificate/backend-b-mtls-server -n backend-b --for=condition=Ready --timeout=60s
kubectl wait certificate/backend-b-mtls-client -n backend-b --for=condition=Ready --timeout=60s
# HTTP and gRPC backends
kubectl wait pod/api -n backend-a --for=condition=Ready --timeout=30s
kubectl wait pod/api -n backend-b --for=condition=Ready --timeout=30s
kubectl wait pod/grpc-api -n backend-a --for=condition=Ready --timeout=30s
kubectl wait pod/grpc-api -n backend-b --for=condition=Ready --timeout=30s
kubectl wait deployment/external-authz -n auth --for=condition=Available --timeout=30s
# mTLS backends (depend on certificates above)
kubectl wait pod/backend-mtls -n backend-a --for=condition=Ready --timeout=30s
kubectl wait pod/backend-mtls -n backend-b --for=condition=Ready --timeout=30s
echo "Fixture deployed. Run scenarios with FIXTURE_DEPLOYED=1 for gateway-only mode."
"""

[tasks."fixture:delete"]
description = "Delete shared backend pods and namespaces"
run = "kubectl delete -k config/fixture --ignore-not-found"

[tasks."netshoot:start"]
description = "Deploy netshoot-client pod for ad-hoc debugging"
run = """
set -euo pipefail
kubectl apply -f config/fixture/00-client-namespace.yaml
kubectl apply -k config/fixture/instances/netshoot-client
kubectl wait pod/netshoot-client -n client --for=condition=Ready --timeout=30s
echo "netshoot-client is ready in the 'client' namespace."
echo "Usage: kubectl exec -n client pod/netshoot-client -- curl ..."
"""

[tasks."netshoot:delete"]
description = "Delete netshoot-client pod and client namespace"
run = """
kubectl delete -k config/fixture/instances/netshoot-client --ignore-not-found
kubectl delete -f config/fixture/00-client-namespace.yaml --ignore-not-found
"""

[tasks."scenarios:run-all"]
description = "Run all scenarios with shared fixture for faster execution"
usage = 'flag "-v --verbose" env="VERBOSE"'
run = """
set -euo pipefail

cleanup_fixture() {
  local run_status=$?
  trap - EXIT
  if ! mise run fixture:delete; then
    echo "WARNING: shared fixture cleanup failed" >&2
  fi
  exit "$run_status"
}
trap cleanup_fixture EXIT

mise run fixture:start{% if usage.verbose %} --verbose{% endif %}
FIXTURE_DEPLOYED=true mise run --continue-on-error --jobs 1 '//scenarios/...:start' --delete
"""

[tasks.clean]
description = "Remove local overrides, logs, and CEC dumps"
run = """
set -euo pipefail
removed=0
for f in mise.local.toml *.log scenarios/*/run-*.log scenarios/*/*/run-*.log; do
  if [ -e "$f" ]; then
    rm -v "$f"
    removed=$((removed + 1))
  fi
done
for f in $(find scenarios -name 'cec-dump*.yaml' 2>/dev/null); do
  rm -v "$f"
  removed=$((removed + 1))
done
if [ "$removed" -eq 0 ]; then
  echo "Nothing to clean"
else
  echo "Removed $removed file(s)"
fi
"""

[tasks.lint]
description = "Run all pre-commit checks against all files"
run = "hk run pre-commit --all"

[tasks."lint:images"]
description = "Check that mise env vars match image tags in pod specs"
run = """
set -euo pipefail

err() { echo "[$(date +'%Y-%m-%dT%H:%M:%S%z')]: $*" >&2; }

rc=0

check() {
  local var="$1" file="$2" image_prefix="$3"
  local version="${!var}"
  local expected="${image_prefix}${version}"
  if ! grep -qF "${expected}" "${file}"; then
    local actual
    actual=$(grep 'image:' "${file}" | head -1 | sed 's/.*image:[[:space:]]*//')
    err "DRIFT: ${var}=${version} expects '${expected}' in ${file}, found '${actual}'"
    rc=1
  fi
}

check NETSHOOT_VERSION     apps/netshoot-client/10-pod.yaml "nicolaka/netshoot:"
check HTTPBIN_VERSION      apps/backend-http/10-pod.yaml    "mccutchen/go-httpbin:"
check ENVOY_VERSION        apps/backend-mtls/20-pod.yaml    "envoyproxy/envoy:v"
check BACKEND_GRPC_VERSION apps/backend-grpc/10-pod.yaml    "backend-grpc:"
check CORAZA_WAF_EXTPROC_VERSION apps/coraza-waf-extproc/20-deployment.yaml "coraza-waf-extproc:"
check EXTERNAL_AUTHZ_VERSION apps/external-authz/10-deployment.yaml "external-authz:"

if [[ ${rc} -eq 0 ]]; then
  echo "lint:images: all image versions match"
fi

exit ${rc}
"""

[tasks."cilium:dump-cec"]
description = "Dump all CiliumEnvoyConfigs to cec-dump.yaml"
run = """
set -euo pipefail
(kubectl get cec -A --no-headers -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name' \
  | while read -r ns name; do
      echo "---"
      kubectl get cec -n "$ns" "$name" -o yaml
    done
) | prettier --parser yaml > cec-dump.yaml
echo "Wrote cec-dump.yaml"
"""

[tasks."kind:start"]
description = "Create the k8s-cilium-gapi kind cluster using config/kind.config"
run = "kind create cluster --config config/kind.config"

[tasks."kind:start:lb"]
description = "Create the k8s-cilium-gapi kind cluster using config/kind.lb.config"
run = "kind create cluster --config config/kind.lb.config"

[tasks."kind:delete"]
description = "Delete the k8s-cilium-gapi kind cluster"
run = "kind delete cluster --name $KIND_CLUSTER_NAME"

[tasks."kind:restart"]
description = "Delete and recreate the k8s-cilium-gapi kind cluster"
depends = ["kind:delete"]
run = "mise run kind:start"

[tasks."helm:repo:add"]
description = "Add the Cilium and Kyverno Helm repos"
hide = true
silent = "stdout"
run = [
  "helm repo add cilium https://helm.cilium.io/",
  "helm repo add kyverno https://kyverno.github.io/kyverno/",
  "helm repo update",
]

[tasks."kind:load:cilium"]
description = "Discover, pull, and load Cilium images into the kind cluster"
depends = ["helm:repo:add"]
hide = true
usage = 'flag "-v --verbose"'
run = """
set -euo pipefail

err() { echo "[$(date +'%Y-%m-%dT%H:%M:%S%z')]: $*" >&2; }

# ── 1. Validate override images exist in Docker (fail fast) ──
if [ -n "${CILIUM_AGENT_IMAGE}" ]; then
  if ! docker image inspect "${CILIUM_AGENT_IMAGE}" >/dev/null 2>&1; then
    echo "ERROR: CILIUM_AGENT_IMAGE '${CILIUM_AGENT_IMAGE}' not found in Docker daemon" >&2
    echo "  Available cilium images:" >&2
    docker images --filter "reference=*cilium*" --format "    {% raw %}{{.Repository}}:{{.Tag}}{% endraw %}" >&2
    exit 1
  fi
  echo "  ✓ CILIUM_AGENT_IMAGE: ${CILIUM_AGENT_IMAGE}"
fi
if [ -n "${CILIUM_OPERATOR_IMAGE}" ]; then
  if ! docker image inspect "${CILIUM_OPERATOR_IMAGE}" >/dev/null 2>&1; then
    echo "ERROR: CILIUM_OPERATOR_IMAGE '${CILIUM_OPERATOR_IMAGE}' not found in Docker daemon" >&2
    echo "  Available operator images:" >&2
    docker images --filter "reference=*operator*" --format "    {% raw %}{{.Repository}}:{{.Tag}}{% endraw %}" >&2
    exit 1
  fi
  echo "  ✓ CILIUM_OPERATOR_IMAGE: ${CILIUM_OPERATOR_IMAGE}"
fi

# ── 2. Discover images via helm images get ──
# Pass the same --set overrides used by cilium:install so the chart
# resolves to the ACTUAL images that will run.  Without this, the chart
# returns its default agent/operator refs and docker pull clobbers any
# locally-built image that shares the same tag.
helm_get_args=()
if [ -n "${CILIUM_CHART_DIR}" ]; then
  helm_get_args+=("${CILIUM_CHART_DIR}")
else
  helm_get_args+=(cilium/cilium --version "${CILIUM_VERSION}")
fi
helm_get_args+=(--values config/values.cilium.yaml)
if [ -n "${CILIUM_AGENT_IMAGE}" ]; then
  helm_get_args+=(--set "image.override=${CILIUM_AGENT_IMAGE}")
fi
if [ -n "${CILIUM_OPERATOR_IMAGE}" ]; then
  helm_get_args+=(--set "operator.image.override=${CILIUM_OPERATOR_IMAGE}")
fi

images=()
while IFS= read -r img; do
  images+=("${img}")
done < <(helm images get "${helm_get_args[@]}" 2>/dev/null \\
  | sed 's/@sha256:.*//' \\
  | sort -u)

# ── 3. Pull remote images; skip those already in Docker daemon ──
# Locally-built override images are already present and must NOT be
# pulled — docker pull would either clobber them with an upstream
# image or fail for local-only tags like localhost:5000/….
for img in "${images[@]}"; do
  if docker image inspect "${img}" >/dev/null 2>&1; then
    echo "  ⊙ ${img} (local — skip pull)"
  else
    docker pull{% if not usage.verbose %} --quiet{% endif %} "${img}" || err "WARN: pull failed for ${img}"
  fi
done

# ── 4. Verify all images are available locally ──
ready=()
missing=()
for img in "${images[@]}"; do
  if docker image inspect "${img}" >/dev/null 2>&1; then
    ready+=("${img}")
  else
    missing+=("${img}")
  fi
done
if [ "${missing[*]:-}" != "" ]; then
  echo "WARNING: image(s) not available locally (skipping):" >&2
  printf '  \u2717 %s\n' "${missing[@]}" >&2
fi
if [ "${ready[*]:-}" = "" ]; then
  echo "ERROR: No images available to load into kind" >&2
  exit 1
fi

# ── 5. Load verified images into kind ──
kind load{% if not usage.verbose %} --quiet{% endif %} docker-image "${ready[@]}" --name "${KIND_CLUSTER_NAME}"
"""

[tasks."kind:load:kyverno"]
description = "Discover, pull, and load Kyverno images into the kind cluster"
depends = ["helm:repo:add"]
hide = true
usage = 'flag "-v --verbose"'
run = """
set -euo pipefail

err() { echo "[$(date +'%Y-%m-%dT%H:%M:%S%z')]: $*" >&2; }

images=()
while IFS= read -r img; do
  images+=("${img}")
done < <(helm images get kyverno/kyverno --version ${KYVERNO_CHART_VERSION} \\
  --values config/values.kyverno.yaml 2>/dev/null \\
  | sed 's/@sha256:.*//' \\
  | sort -u)

for img in "${images[@]}"; do
  docker pull{% if not usage.verbose %} --quiet{% endif %} "${img}" || err "WARN: pull failed for ${img}, using local image"
done

kind load{% if not usage.verbose %} --quiet{% endif %} docker-image "${images[@]}" --name "${KIND_CLUSTER_NAME}"
"""

[tasks."kind:load:apps"]
description = "Build, pull, and load demo app images into the kind cluster"
hide = true
usage = 'flag "-v --verbose"'
run = """
set -euo pipefail

err() { echo "[$(date +'%Y-%m-%dT%H:%M:%S%z')]: $*" >&2; }

docker build{% if not usage.verbose %} --quiet{% endif %} -t backend-grpc:${BACKEND_GRPC_VERSION} apps/backend-grpc/image
if ! docker image inspect "backend-grpc:${BACKEND_GRPC_VERSION}" >/dev/null 2>&1; then
  echo "ERROR: backend-grpc:${BACKEND_GRPC_VERSION} build failed — image not found in Docker daemon" >&2
  exit 1
fi

docker build{% if not usage.verbose %} --quiet{% endif %} -t coraza-waf-extproc:${CORAZA_WAF_EXTPROC_VERSION} apps/coraza-waf-extproc/image
if ! docker image inspect "coraza-waf-extproc:${CORAZA_WAF_EXTPROC_VERSION}" >/dev/null 2>&1; then
  echo "ERROR: coraza-waf-extproc:${CORAZA_WAF_EXTPROC_VERSION} build failed — image not found in Docker daemon" >&2
  exit 1
fi

docker build{% if not usage.verbose %} --quiet{% endif %} -t external-authz:${EXTERNAL_AUTHZ_VERSION} apps/external-authz/image
if ! docker image inspect "external-authz:${EXTERNAL_AUTHZ_VERSION}" >/dev/null 2>&1; then
  echo "ERROR: external-authz:${EXTERNAL_AUTHZ_VERSION} build failed — image not found in Docker daemon" >&2
  exit 1
fi

remote_images=(
  "nicolaka/netshoot:${NETSHOOT_VERSION}"
  "mccutchen/go-httpbin:${HTTPBIN_VERSION}"
  "envoyproxy/envoy:v${ENVOY_VERSION}"
)

for img in "${remote_images[@]}"; do
  docker pull{% if not usage.verbose %} --quiet{% endif %} "${img}" || err "WARN: pull failed for ${img}, using local image"
done

all_images=("backend-grpc:${BACKEND_GRPC_VERSION}" "coraza-waf-extproc:${CORAZA_WAF_EXTPROC_VERSION}" "external-authz:${EXTERNAL_AUTHZ_VERSION}" "${remote_images[@]}")
kind load docker-image {% if not usage.verbose %}--quiet {% endif %}\\
  "${all_images[@]}" \\
  --name "${KIND_CLUSTER_NAME}"

# Verify images are actually present on at least one worker node
worker_node="${KIND_CLUSTER_NAME}-worker"
echo "--- Image load verification ---"
load_ok=true
for img in "${all_images[@]}"; do
  if docker exec "$worker_node" crictl images -o json 2>/dev/null | grep -q "${img}"; then
    echo "  ✅ $img"
  else
    echo "  ❌ $img — NOT FOUND on $worker_node" >&2
    load_ok=false
  fi
done
if [ "$load_ok" != true ]; then
  echo "ERROR: one or more images failed to load — pods will get ErrImagePull" >&2
  exit 1
fi
"""

[tasks."cilium:uninstall"]
description = "Uninstall Cilium from the cluster using Helm"
run = "helm uninstall cilium --namespace kube-system"

[tasks."cilium:reinstall"]
description = "Uninstall and install Cilium again in kube-proxy-free mode"
usage = 'flag "-v --verbose" env="VERBOSE" help="Enable verbose output for image pulls and builds"'
run = "mise run cilium:uninstall && mise run cilium:install{% if usage.verbose %} --verbose{% endif %}"

[tasks."cilium:reinstall:lb"]
description = "Uninstall and install Cilium again in load-balancer mode"
usage = 'flag "-v --verbose" env="VERBOSE" help="Enable verbose output for image pulls and builds"'
run = "mise run cilium:uninstall && mise run cilium:install --lb{% if usage.verbose %} --verbose{% endif %}"

[tasks."cilium:reload"]
description = "Load locally-built Cilium images into kind and restart the agent + operator"
run = """
set -euo pipefail

if [ -z "${CILIUM_AGENT_IMAGE}" ] && [ -z "${CILIUM_OPERATOR_IMAGE}" ]; then
  echo "ERROR: Neither CILIUM_AGENT_IMAGE nor CILIUM_OPERATOR_IMAGE is set." >&2
  echo "  Copy versions/branch.toml to mise.local.toml for branch builds." >&2
  exit 1
fi

images=()
if [ -n "${CILIUM_AGENT_IMAGE}" ]; then
  if ! docker image inspect "${CILIUM_AGENT_IMAGE}" >/dev/null 2>&1; then
    echo "ERROR: CILIUM_AGENT_IMAGE '${CILIUM_AGENT_IMAGE}' not found in Docker daemon" >&2
    echo "  Run 'make dev-docker-image' in the cilium repo first." >&2
    exit 1
  fi
  images+=("${CILIUM_AGENT_IMAGE}")
  echo "  ✓ agent:    ${CILIUM_AGENT_IMAGE}"
fi
if [ -n "${CILIUM_OPERATOR_IMAGE}" ]; then
  if ! docker image inspect "${CILIUM_OPERATOR_IMAGE}" >/dev/null 2>&1; then
    echo "ERROR: CILIUM_OPERATOR_IMAGE '${CILIUM_OPERATOR_IMAGE}' not found in Docker daemon" >&2
    echo "  Run 'make dev-docker-operator-generic-image' in the cilium repo first." >&2
    exit 1
  fi
  images+=("${CILIUM_OPERATOR_IMAGE}")
  echo "  ✓ operator: ${CILIUM_OPERATOR_IMAGE}"
fi

echo "Loading images into kind cluster '${KIND_CLUSTER_NAME}'..."
kind load docker-image "${images[@]}" --name "${KIND_CLUSTER_NAME}"

echo "Restarting Cilium..."
if [ -n "${CILIUM_AGENT_IMAGE}" ]; then
  kubectl rollout restart daemonset/cilium -n kube-system
fi
if [ -n "${CILIUM_OPERATOR_IMAGE}" ]; then
  kubectl rollout restart deployment/cilium-operator -n kube-system
fi

echo "Waiting for rollout..."
kubectl rollout status daemonset/cilium -n kube-system --timeout=120s
kubectl rollout status deployment/cilium-operator -n kube-system --timeout=60s
echo "✓ Cilium reloaded successfully"
"""

[tasks."gateway-api:install"]
description = "Install Gateway API experimental CRDs before enabling Cilium Gateway API support"
hide = true
silent = "stdout"
run = """
kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v$GATEWAY_API_VERSION/experimental-install.yaml
"""

[tasks."cloud-provider-kind:install"]
description = "Install cloud-provider-kind into .bin for load-balancer scenarios"
hide = true
silent = "stdout"
run = """
mkdir -p .bin
GOBIN=$PWD/.bin go install sigs.k8s.io/cloud-provider-kind@v$CLOUD_PROVIDER_KIND_VERSION
"""

[tasks."cloud-provider-kind:start"]
description = "Start cloud-provider-kind in a dedicated terminal for load-balancer scenarios"
depends = ["cloud-provider-kind:install"]
run = "sudo --preserve-env=KUBECONFIG ./.bin/cloud-provider-kind --enable-lb-port-mapping --gateway-channel disabled"

[tasks."cert-manager:install"]
description = "Install cert-manager for TLS-focused scenarios"
silent = "stdout"
depends_post = ["cert-manager:verify"]
run = """
helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager \
  --namespace cert-manager \
  --create-namespace \
  --version v$CERT_MANAGER_VERSION \
  --set crds.enabled=true \
  --set prometheus.enabled=false \
  --wait \
  --timeout 5m
"""

[tasks."cert-manager:verify"]
description = "Verify the cert-manager control plane and CRDs are ready"
hide = true
silent = "stdout"
run = """
kubectl wait deployment/cert-manager -n cert-manager --for=condition=Available --timeout=180s
kubectl wait deployment/cert-manager-cainjector -n cert-manager --for=condition=Available --timeout=180s
kubectl wait deployment/cert-manager-webhook -n cert-manager --for=condition=Available --timeout=180s
kubectl get crd certificates.cert-manager.io issuers.cert-manager.io clusterissuers.cert-manager.io
"""

[tasks."cert-manager:delete"]
description = "Remove cert-manager when TLS scenarios are no longer needed"
run = [
  "helm uninstall cert-manager --namespace cert-manager --ignore-not-found",
  "kubectl delete namespace cert-manager --ignore-not-found=true --wait=false",
]

[tasks."kyverno:install"]
description = "Install Kyverno for future policy-focused scenarios"
silent = "stdout"
usage = 'flag "-v --verbose" env="VERBOSE"'
depends = ["kind:load:kyverno{% if usage.verbose %} --verbose{% endif %}"]
depends_post = ["kyverno:verify"]
run = """
helm upgrade --install kyverno kyverno/kyverno \
  --namespace kyverno \
  --create-namespace \
  --version $KYVERNO_CHART_VERSION \
  --values config/values.kyverno.yaml \
  --wait \
  --timeout 5m
"""

[tasks."kyverno:verify"]
description = "Verify the Kyverno control plane is ready"
hide = true
silent = "stdout"
run = """
kubectl wait deployment/kyverno-admission-controller -n kyverno --for=condition=Available --timeout=180s
kubectl wait deployment/kyverno-background-controller -n kyverno --for=condition=Available --timeout=180s
kubectl wait deployment/kyverno-cleanup-controller -n kyverno --for=condition=Available --timeout=180s
kubectl wait deployment/kyverno-reports-controller -n kyverno --for=condition=Available --timeout=180s
"""

[tasks."kyverno:delete"]
description = "Remove Kyverno when policy-focused scenarios are no longer needed"
run = [
  "helm uninstall kyverno --namespace kyverno --ignore-not-found",
  "kubectl delete namespace kyverno --ignore-not-found=true --wait=false",
]

[tasks."cilium:install"]
description = "Install Cilium in kube-proxy-free mode using Helm"
usage = '''
flag "-v --verbose" env="VERBOSE"
flag "--lb" env="LOAD_BALANCER" help="Use LoadBalancer service configuration"
'''
depends = [
  "kind:load:cilium{% if usage.verbose %} --verbose{% endif %}",
  "gateway-api:install",
]
run = """
APISERVER_IP=$(docker inspect -f '{% raw %}{{.NetworkSettings.Networks.kind.IPAddress}}{% endraw %}' ${KIND_CLUSTER_NAME}-control-plane)
if [ -z "$APISERVER_IP" ]; then
  echo "ERROR: could not resolve control-plane IP from Docker – is the kind cluster running?" >&2
  exit 1
fi
helm_args=(install cilium)
if [ -n "${CILIUM_CHART_DIR}" ]; then
  helm_args+=("${CILIUM_CHART_DIR}")
else
  helm_args+=(cilium/cilium --version "${CILIUM_VERSION}")
fi
values_file="config/values.cilium.yaml"
if [ "${usage_lb:-${LOAD_BALANCER:-false}}" = "true" ]; then
  values_file="config/values.cilium.lb.yaml"
  echo "Installing Cilium with LoadBalancer service configuration"
fi
helm_args+=(
  --namespace kube-system
  --values "$values_file"
  --set "k8sServiceHost=${APISERVER_IP}"
  --set k8sServicePort=6443
  --set securityContext.privileged=true
)
if [ -n "${CILIUM_AGENT_IMAGE}" ]; then
  helm_args+=(--set "image.override=${CILIUM_AGENT_IMAGE}")
fi
if [ -n "${CILIUM_OPERATOR_IMAGE}" ]; then
  helm_args+=(--set "operator.image.override=${CILIUM_OPERATOR_IMAGE}")
fi
if [ -n "${CILIUM_CHART_DIR}" ]; then
  helm_args+=(
    --set image.pullPolicy=IfNotPresent
    --set operator.image.pullPolicy=IfNotPresent
    --set hubble.relay.image.pullPolicy=IfNotPresent
    --set envoy.image.pullPolicy=IfNotPresent
  )
fi
helm "${helm_args[@]}"
"""


[tasks."cluster:start"]
description = "Bootstrap the full cluster: kind + Cilium in order"
usage = '''
flag "-v --verbose" env="VERBOSE" help="Enable verbose output for image pulls and builds"
flag "--lb" env="LOAD_BALANCER" help="Use the LoadBalancer cluster configuration"
'''
depends = ["kind:start{% if usage.lb %}:lb{% endif %}"]
depends_post = ["cluster:verify"]
run = "mise run cilium:install{% if usage.lb %} --lb{% endif %}{% if usage.verbose %} --verbose{% endif %} && mise run kind:load:apps{% if usage.verbose %} --verbose{% endif %}"


[tasks."cluster:verify"]
description = "Verify the cluster is healthy: Cilium status ready"
run = ["cilium status --wait --interactive=false --wait-duration 5m"]

[tasks."cluster:delete"]
description = "Delete the full cluster"
run = "mise run kind:delete"

[tasks."cluster:restart"]
description = "Delete and fully rebuild the cluster"
usage = '''
flag "-v --verbose" env="VERBOSE" help="Enable verbose output for image pulls and builds"
flag "--lb" env="LOAD_BALANCER" help="Use the LoadBalancer cluster configuration"
'''
depends = ["cluster:delete"]
run = "mise run cluster:start{% if usage.lb %} --lb{% endif %}{% if usage.verbose %} --verbose{% endif %}"
