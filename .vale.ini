StylesPath = .vale/styles
MinAlertLevel = warning

Packages = Google

# Project vocabulary — technical terms that are not misspellings
Vocab = k8s-cilium-gapi

# Do not lint inline code or code blocks as prose.
IgnoredScopes = code, tt

[*.md]
BasedOnStyles = Vale, Google

# Do not lint literal technical tokens as prose.
TokenIgnores = (`[^`]+`)

# Too noisy for technical docs full of Kubernetes/Cilium jargon
Vale.Spelling = NO
Google.Spelling = NO

# "locally-built", "kind-based" etc. are natural in infra docs
Google.LyHyphens = suggestion

[.agents/skills/**]
BasedOnStyles =
